<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Chat - Real-time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -250px;
            right: -250px;
            animation: float 20s infinite alternate;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -200px;
            left: -200px;
            animation: float 15s infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .chat-header {
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px 24px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .online-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .message {
            display: flex;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            flex-direction: row-reverse;
        }

        .message.system {
            justify-content: center;
        }

        .message.system .message-bubble {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            text-align: center;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.system .message-avatar {
            display: none;
        }

        .message-content {
            max-width: 70%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message.system .message-content {
            max-width: 80%;
        }

        .message-author {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            padding: 0 12px;
        }

        .message.own .message-author {
            text-align: right;
        }

        .message.system .message-author {
            display: none;
        }

        .message-bubble {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #ffffff;
            word-wrap: break-word;
            line-height: 1.5;
        }

        .message.own .message-bubble {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .message-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            padding: 0 12px;
        }

        .message.own .message-time {
            text-align: right;
        }

        .message.system .message-time {
            text-align: center;
        }

        .typing-indicator {
            display: none;
            padding: 10px 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-style: italic;
        }

        .typing-indicator.show {
            display: block;
        }

        .chat-input-container {
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0 0 24px 24px;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .chat-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .send-button {
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .send-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .send-button:active {
            transform: translateY(0);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .username-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .username-modal.hidden {
            display: none;
        }

        .username-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .username-card h2 {
            color: #ffffff;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .username-card p {
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }

        .username-input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
            text-align: center;
        }

        .username-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .username-button {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .username-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            z-index: 1001;
            display: none;
        }

        .connection-status.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        .connection-status.connected {
            background: rgba(34, 197, 94, 0.9);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }

            .chat-header {
                border-radius: 0;
            }

            .chat-input-container {
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">Відключено від сервера</div>

    <div class="username-modal" id="usernameModal">
        <div class="username-card">
            <h2>Ласкаво просимо</h2>
            <p>Введіть ваше ім'я для початку</p>
            <input type="text" class="username-input" id="usernameInput" placeholder="Ваше ім'я..." maxlength="20">
            <button class="username-button" id="usernameButton">Почати чат</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Glass Chat</h1>
            <div class="online-status">
                <div class="status-dot"></div>
                <span id="onlineCount">0 онлайн</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message system">
                <div class="message-content">
                    <div class="message-bubble">Вітаємо в Glass Chat! Підключення до сервера... 💬</div>
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            Хтось друкує...
        </div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <input type="text" class="chat-input" id="messageInput" placeholder="Напишіть повідомлення..." disabled>
                <button class="send-button" id="sendButton" disabled>Надіслати</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let socket;
        let username = '';
        let typingTimer;

        const usernameModal = document.getElementById('usernameModal');
        const usernameInput = document.getElementById('usernameInput');
        const usernameButton = document.getElementById('usernameButton');
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const onlineCount = document.getElementById('onlineCount');
        const typingIndicator = document.getElementById('typingIndicator');
        const connectionStatus = document.getElementById('connectionStatus');

        // Initialize Socket.io connection
        function initSocket() {
            socket = io();

            socket.on('connect', () => {
                console.log('Connected to server');
                showConnectionStatus('Підключено', true);
                
                if (username) {
                    socket.emit('set username', username);
                    messageInput.disabled = false;
                    sendButton.disabled = false;
                }
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
                showConnectionStatus('Відключено від сервера', false);
                messageInput.disabled = true;
                sendButton.disabled = true;
            });

            socket.on('load messages', (messages) => {
                messages.forEach(msg => {
                    displayMessage(msg);
                });
            });

            socket.on('new message', (message) => {
                displayMessage(message);
                scrollToBottom();
            });

            socket.on('online count', (count) => {
                onlineCount.textContent = `${count} онлайн`;
            });

            socket.on('user typing', (username) => {
                typingIndicator.textContent = `${username} друкує...`;
                typingIndicator.classList.add('show');
            });

            socket.on('user stop typing', () => {
                typingIndicator.classList.remove('show');
            });
        }

        function showConnectionStatus(message, isConnected) {
            connectionStatus.textContent = message;
            connectionStatus.classList.add('show');
            if (isConnected) {
                connectionStatus.classList.add('connected');
            } else {
                connectionStatus.classList.remove('connected');
            }
            
            setTimeout(() => {
                connectionStatus.classList.remove('show');
            }, 3000);
        }

        function setUsername() {
            const input = usernameInput.value.trim();
            if (input.length === 0) return;

            username = input;
            localStorage.setItem('chatUsername', username);
            usernameModal.classList.add('hidden');
            
            socket.emit('set username', username);
            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.focus();
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message.length === 0) return;

            socket.emit('send message', {
                author: username,
                text: message
            });

            messageInput.value = '';
            socket.emit('stop typing');
        }

        function displayMessage(messageData) {
            const messageDiv = document.createElement('div');
            
            if (messageData.isSystem) {
                messageDiv.className = 'message system';
            } else {
                messageDiv.className = messageData.author === username ? 'message own' : 'message';
            }
            
            const avatar = messageData.author.charAt(0).toUpperCase();
            const time = new Date(messageData.timestamp).toLocaleTimeString('uk-UA', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });

            if (messageData.isSystem) {
                messageDiv.innerHTML = `
                    <div class="message-content">
                        <div class="message-bubble">${escapeHtml(messageData.text)}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="message-avatar">${avatar}</div>
                    <div class="message-content">
                        <div class="message-author">${escapeHtml(messageData.author)}</div>
                        <div class="message-bubble">${escapeHtml(messageData.text)}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;
            }

            chatMessages.appendChild(messageDiv);
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        usernameButton.addEventListener('click', setUsername);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') setUsername();
        });

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Typing indicator
        messageInput.addEventListener('input', () => {
            socket.emit('typing', username);
            
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                socket.emit('stop typing');
            }, 1000);
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('chatUsername');
            if (savedUsername) {
                usernameInput.value = savedUsername;
            }
            
            initSocket();
        });
    </script>
</body>
</html>
